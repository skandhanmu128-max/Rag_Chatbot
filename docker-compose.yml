version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: documind_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-documind_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-documind_pass}
      POSTGRES_DB: ${POSTGRES_DB:-documind}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-documind_user} -d ${POSTGRES_DB:-documind}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
